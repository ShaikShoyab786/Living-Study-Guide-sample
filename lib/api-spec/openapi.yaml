openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: study
    description: Notes, generated study cards, reviews, and verified library
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /notes:
    get:
      operationId: listNotes
      tags: [study]
      summary: List study notes
      responses:
        "200":
          description: Notes ordered by most recently updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createNote
      tags: [study]
      summary: Save lecture notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Saved note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
  /notes/{noteId}:
    delete:
      operationId: deleteNote
      tags: [study]
      summary: Delete one study note and its associated cards
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Note and associated study cards deleted
        "400":
          description: Invalid note ID
        "404":
          description: Note not found
  /notes/pdf-study-pack:
    post:
      operationId: createPdfStudyPack
      tags: [study]
      summary: Extract PDF lecture text and create a study pack
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PdfStudyPackInput"
      responses:
        "201":
          description: Saved note and generated cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfStudyPack"
        "400":
          description: Invalid or unreadable PDF
        "413":
          description: PDF exceeds the upload or page limit
  /notes/pdf-text:
    post:
      operationId: extractPdfText
      tags: [study]
      summary: Extract selectable text from a PDF
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PdfTextInput"
      responses:
        "200":
          description: Extracted PDF text and page count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfTextExtraction"
        "400":
          description: Invalid, unreadable, or password-protected PDF
        "413":
          description: PDF exceeds the upload or page limit
        "422":
          description: PDF contains no selectable text
  /notes/{noteId}/cards:
    get:
      operationId: listNoteCards
      tags: [study]
      summary: List generated cards for a note
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cards generated from the note
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedCard"
  /notes/{noteId}/cards/more:
    post:
      operationId: generateMoreCards
      tags: [study]
      summary: Generate new, uncovered cards for a note
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Newly generated cards and whether more may be available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdditionalCardsResult"
        "404":
          description: Note not found
        "503":
          description: Additional questions could not be generated
  /notes/{noteId}/extract:
    post:
      operationId: extractStudyPack
      tags: [study]
      summary: Extract source-linked study cards from a note
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Generated cards and extraction mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionResult"
        "404":
          description: Note not found
  /cards/{cardId}/review:
    patch:
      operationId: reviewCard
      tags: [study]
      summary: Approve, edit and approve, or discard a generated card
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardReviewInput"
      responses:
        "200":
          description: Reviewed card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedCard"
        "404":
          description: Card not found
  /library:
    get:
      operationId: searchLibrary
      tags: [study]
      summary: Search approved study cards
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching approved cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryCard"
  /library/guides:
    get:
      operationId: listVerifiedGuides
      tags: [study]
      summary: List note sessions with approved study cards
      responses:
        "200":
          description: Verified guide sessions with approved-card counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VerifiedGuideSummary"
  /library/guides/{noteId}:
    get:
      operationId: fetchVerifiedGuide
      tags: [study]
      summary: Get approved study cards for one note session
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: One verified study guide and its matching approved cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifiedGuide"
        "404":
          description: Note session not found
  /study/summary:
    get:
      operationId: getStudySummary
      tags: [study]
      summary: Get workspace study totals
      responses:
        "200":
          description: Workspace totals for notes, review, and library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Note:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        rawText:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, title, rawText, createdAt]
    NoteInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        rawText:
          type: string
          minLength: 1
      required: [title, rawText]
    PdfStudyPackInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        file:
          type: string
          format: binary
      required: [title, file]
    PdfTextInput:
      type: object
      properties:
        file:
          type: string
          format: binary
      required: [file]
    PdfTextExtraction:
      type: object
      properties:
        text:
          type: string
        pageCount:
          type: integer
      required: [text, pageCount]
    GeneratedCard:
      type: object
      properties:
        id:
          type: string
        noteId:
          type: string
        sourceExcerpt:
          type: string
        concept:
          type: string
        question:
          type: string
        answer:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        createdAt:
          type: string
          format: date-time
      required: [id, noteId, sourceExcerpt, concept, question, answer, status, createdAt]
    LibraryCard:
      type: object
      properties:
        id:
          type: string
        cardId:
          type: string
        concept:
          type: string
        question:
          type: string
        answer:
          type: string
        editedByUser:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, cardId, concept, question, answer, editedByUser, createdAt]
    CardReviewInput:
      type: object
      properties:
        action:
          type: string
          enum: [approve, edit_approve, discard]
        concept:
          type: string
        question:
          type: string
        answer:
          type: string
      required: [action]
    ExtractionResult:
      type: object
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedCard"
        mode:
          type: string
          enum: [ai, demo]
      required: [cards, mode]
    AdditionalCardsResult:
      type: object
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedCard"
        hasMore:
          type: boolean
        mode:
          type: string
          enum: [ai, demo]
      required: [cards, hasMore, mode]
    VerifiedGuideSummary:
      type: object
      properties:
        noteId:
          type: string
        title:
          type: string
        approvedCount:
          type: integer
      required: [noteId, title, approvedCount]
    VerifiedGuideCard:
      type: object
      properties:
        id:
          type: string
        cardId:
          type: string
        sourceExcerpt:
          type: string
        concept:
          type: string
        question:
          type: string
        answer:
          type: string
        editedByUser:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, cardId, sourceExcerpt, concept, question, answer, editedByUser, createdAt]
    VerifiedGuide:
      type: object
      properties:
        noteId:
          type: string
        title:
          type: string
        cards:
          type: array
          items:
            $ref: "#/components/schemas/VerifiedGuideCard"
      required: [noteId, title, cards]
    PdfStudyPack:
      type: object
      properties:
        note:
          $ref: "#/components/schemas/Note"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedCard"
        mode:
          type: string
          enum: [ai, demo]
      required: [note, cards, mode]
    StudySummary:
      type: object
      properties:
        notes:
          type: integer
        pending:
          type: integer
        approved:
          type: integer
      required: [notes, pending, approved]

