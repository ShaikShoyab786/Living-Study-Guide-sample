kind = "web"
previewPath = "/"
title = "Study with Miky"
description = "An AI-powered personal learning companion that turns notes into source-linked questions learners can review, refine, and keep."
version = "1.0.0"
id = "artifacts/living-study-guide"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23877

[services.development]
run = "pnpm --filter @workspace/living-study-guide run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/living-study-guide", "run", "build" ]
serve = "static"
publicDir = "artifacts/living-study-guide/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23877"
BASE_PATH = "/"
